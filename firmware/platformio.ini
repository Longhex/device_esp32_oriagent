[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed  = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1

lib_deps =
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^6.21.5

; Tăng stack của Arduino loop task (loop() chạy ở đây)
; NetworkTask và DataTask tự cấp phát stack riêng qua xTaskCreatePinnedToCore
board_build.partitions = default.csv
