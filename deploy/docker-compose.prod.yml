name: xiaozhi-prod

services:
  xiaozhi-server:
    image: ${SERVER_IMAGE_NAME:-xiaozhi-server-custom:local}
    build:
      context: ..
      dockerfile: Dockerfile-server
    restart: always
    security_opt:
      - seccomp:unconfined
    environment:
      TZ: ${TZ:-Asia/Saigon}
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LANGUAGE: en_US:en
      SEARCH_PROXY: ${SEARCH_PROXY:-}
      APP_ENV: production
      TRUST_PROXY_HEADERS: "true"
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-device.oriagent.com}
      PUBLIC_WEBSOCKET_URL: ${PUBLIC_WEBSOCKET_URL:-}
      # Provisioning boundary. Point this to the future serial-validation service
      # without changing the OTA server; it currently uses device-monitor.
      DEVICE_PROVISIONER_API: ${DEVICE_PROVISIONER_API:-http://device-monitor:8090}
      # Temporary onboarding bridge. Keep false once serial validation is external.
      AUTO_DECLARE_OTA_SERIAL: ${AUTO_DECLARE_OTA_SERIAL:-false}
      TRANSPORT_MODE: ${TRANSPORT_MODE:-mqtt_udp_hk}
      FIRMWARE_TRANSPORT_POLICY: ${FIRMWARE_TRANSPORT_POLICY:-mqtt_only}
      MQTT_SIGNALING_CONTRACT: hk_legacy
      HK_MQTT_UPLINK_SUFFIX: ${HK_MQTT_UPLINK_SUFFIX:-AI_MONITOR}
      HK_MQTT_DOWNLINK_SUFFIX: ${HK_MQTT_DOWNLINK_SUFFIX:-AI_REMOTE}
      HK_MQTT_KEEP_COLON_TOPIC: ${HK_MQTT_KEEP_COLON_TOPIC:-false}
      MQTT_HOST: emqx
      MQTT_PORT: "1883"
      MQTT_USERNAME: ${MQTT_BACKEND_USER:-oriagent-monitor}
      MQTT_PASSWORD: ${MQTT_BACKEND_PASS:?Set MQTT_BACKEND_PASS in .env}
      PUBLIC_UDP_HOST: ${PUBLIC_UDP_HOST:?Set PUBLIC_UDP_HOST to the public IP/domain reachable by firmware}
      UDP_PORT: ${VOICE_UDP_PORT:-8883}
    volumes:
      - ./data:/opt/xiaozhi-esp32-server/data
      - ../main/xiaozhi-server/models:/opt/xiaozhi-esp32-server/models
    expose:
      - "8003"
    ports:
      - "${VOICE_UDP_PORT:-8883}:${VOICE_UDP_PORT:-8883}/udp"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/xiaozhi/ota/', timeout=3).read()" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      xiaozhi-db:
        condition: service_healthy
      xiaozhi-redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
      device-monitor-provision:
        condition: service_completed_successfully
      device-monitor:
        condition: service_started
    mem_limit: ${SERVER_MEMORY_LIMIT:-2500m}
    cpus: ${SERVER_CPU_LIMIT:-1.2}
    networks:
      backend:
        aliases:
          - xiaozhi-esp32-server

  xiaozhi-web:
    image: ${WEB_IMAGE_NAME:-xiaozhi-web-custom:local}
    build:
      context: ..
      dockerfile: Dockerfile-web
    restart: always
    environment:
      TZ: ${TZ:-Asia/Saigon}
      SPRING_DATASOURCE_DRUID_URL: jdbc:mysql://xiaozhi-esp32-server-db:3306/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      SPRING_DATASOURCE_DRUID_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_DRUID_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: xiaozhi-esp32-server-redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_DATA_REDIS_PORT: 6379
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ./uploadfile:/uploadfile
    ports:
      - "8002:8002"
    depends_on:
      xiaozhi-db:
        condition: service_healthy
      xiaozhi-redis:
        condition: service_healthy
    mem_limit: ${WEB_MEMORY_LIMIT:-700m}
    cpus: ${WEB_CPU_LIMIT:-0.4}
    networks:
      backend:
        aliases:
          - xiaozhi-esp32-server-web

  xiaozhi-db:
    image: mysql:${MYSQL_IMAGE_TAG:-latest}
    restart: always
    environment:
      TZ: ${TZ:-Asia/Saigon}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xiaozhi_esp32_server}
      MYSQL_INITDB_ARGS: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./mysql/data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD}" ]
      timeout: 45s
      interval: 10s
      retries: 10
      start_period: 30s
    mem_limit: ${MYSQL_MEMORY_LIMIT:-400m}
    cpus: ${MYSQL_CPU_LIMIT:-0.2}
    networks:
      backend:
        aliases:
          - xiaozhi-esp32-server-db

  xiaozhi-redis:
    image: redis:${REDIS_IMAGE_TAG:-8.0}
    restart: always
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    mem_limit: ${REDIS_MEMORY_LIMIT:-100m}
    cpus: ${REDIS_CPU_LIMIT:-0.1}
    networks:
      backend:
        aliases:
          - xiaozhi-esp32-server-redis

  # EMQX broker — mặt phẳng QUẢN LÝ/GIÁM SÁT thiết bị (độc lập với luồng audio xiaozhi).
  # Dùng cho: presence online/offline (LWT), telemetry, lệnh cấu hình/nâng cấp.
  # KHÔNG liên quan tới xiaozhi-mqtt-gateway (kênh truyền audio MQTT+UDP).
  emqx:
    image: emqx/emqx:${EMQX_IMAGE_TAG:-5.8}
    restart: always
    environment:
      TZ: ${TZ:-Asia/Saigon}
      EMQX_NODE__NAME: emqx@127.0.0.1
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:?Set EMQX_NODE_COOKIE in .env}
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?Set EMQX_DASHBOARD_PASSWORD in .env}
      # LƯU Ý BẢO MẬT: EMQX 5.x mặc định CHO PHÉP ẩn danh khi chưa cấu hình authenticator.
      # Trước khi mở cổng 1883/8883 ra public PHẢI thêm authn (Dashboard > Access Control >
      # Authentication) — built-in DB hoặc HTTP authn trỏ về manager-api. Xem README_PRODUCTION.md.
    ports:
      # Cổng thiết bị kết nối từ Internet — phải mở public
      - "${MQTT_TCP_PORT:-1883}:1883"      # MQTT TCP
      - "${MQTT_SSL_PORT:-8883}:8883"      # MQTT over TLS
      - "${MQTT_WS_PORT:-8083}:8083"       # MQTT over WebSocket (cho app/web nếu cần)
      - "${MQTT_WSS_PORT:-8084}:8084"      # MQTT over WSS
      # Dashboard quản trị — chỉ bind localhost, truy cập qua SSH tunnel cho an toàn
      - "${EMQX_DASHBOARD_BIND:-127.0.0.1}:${EMQX_DASHBOARD_PORT:-18083}:18083"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: [ "CMD", "/opt/emqx/bin/emqx", "ctl", "status" ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: ${EMQX_MEMORY_LIMIT:-512m}
    cpus: ${EMQX_CPU_LIMIT:-0.5}
    networks:
      backend:
        aliases:
          - emqx

  # Idempotent one-shot provisioning for EMQX authn/authz and backend ACL.
  device-monitor-provision:
    image: ${MONITOR_IMAGE_NAME:-oriagent-device-monitor:local}
    build:
      context: ../main/device-monitor
      dockerfile: Dockerfile
    restart: "no"
    command: [ "python", "provision_auth.py" ]
    environment:
      EMQX_API_BASE: http://emqx:18083/api/v5
      EMQX_DASHBOARD_USER: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?Set EMQX_DASHBOARD_PASSWORD in .env}
      MQTT_BACKEND_USER: ${MQTT_BACKEND_USER:-oriagent-monitor}
      MQTT_BACKEND_PASS: ${MQTT_BACKEND_PASS:?Set MQTT_BACKEND_PASS in .env}
      ENABLE_HK_LEGACY_BRIDGE: ${ENABLE_HK_LEGACY_BRIDGE:-true}
      HK_MQTT_UPLINK_SUFFIX: ${HK_MQTT_UPLINK_SUFFIX:-AI_MONITOR}
      HK_MQTT_DOWNLINK_SUFFIX: ${HK_MQTT_DOWNLINK_SUFFIX:-AI_REMOTE}
      HK_MQTT_TOPIC_IDENTITY: ${HK_MQTT_TOPIC_IDENTITY:-serial}
      HK_MQTT_KEEP_COLON_TOPIC: ${HK_MQTT_KEEP_COLON_TOPIC:-false}
      MQTT_SHARED_TEST_SERIALS: ${MQTT_SHARED_TEST_SERIALS:-}
      MQTT_SHARED_TEST_USERNAME: ${MQTT_SHARED_TEST_USERNAME:-}
      MQTT_SHARED_TEST_PASSWORD: ${MQTT_SHARED_TEST_PASSWORD:-}
    depends_on:
      emqx:
        condition: service_healthy
    networks:
      - backend

  # Consumer mặt phẳng quản lý: nhận presence/telemetry/ack từ EMQX, mirror sang
  # Redis (state chung cho web/app), expose HTTP API. Độc lập luồng audio xiaozhi.
  device-monitor:
    image: ${MONITOR_IMAGE_NAME:-oriagent-device-monitor:local}
    build:
      context: ../main/device-monitor
      dockerfile: Dockerfile
    restart: always
    environment:
      TZ: ${TZ:-Asia/Saigon}
      EMQX_HOST: emqx
      EMQX_MQTT_PORT: "1883"
      REDIS_HOST: xiaozhi-esp32-server-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MQTT_BACKEND_USER: ${MQTT_BACKEND_USER:-oriagent-monitor}
      MQTT_BACKEND_PASS: ${MQTT_BACKEND_PASS:?Set MQTT_BACKEND_PASS in .env}
      ENABLE_HK_LEGACY_BRIDGE: ${ENABLE_HK_LEGACY_BRIDGE:-true}
      HK_MQTT_UPLINK_SUFFIX: ${HK_MQTT_UPLINK_SUFFIX:-AI_MONITOR}
      HK_MQTT_DOWNLINK_SUFFIX: ${HK_MQTT_DOWNLINK_SUFFIX:-AI_REMOTE}
      HK_MQTT_TOPIC_IDENTITY: ${HK_MQTT_TOPIC_IDENTITY:-serial}
      HK_MQTT_KEEP_COLON_TOPIC: ${HK_MQTT_KEEP_COLON_TOPIC:-false}
      MQTT_SHARED_TEST_SERIALS: ${MQTT_SHARED_TEST_SERIALS:-}
      MQTT_SHARED_TEST_USERNAME: ${MQTT_SHARED_TEST_USERNAME:-}
      MQTT_SHARED_TEST_PASSWORD: ${MQTT_SHARED_TEST_PASSWORD:-}
      MONITOR_HTTP_PORT: "8090"
      # Admin EMQX (để /activate cấp credential cho thiết bị)
      EMQX_API_BASE: http://emqx:18083/api/v5
      EMQX_DASHBOARD_USER: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?Set EMQX_DASHBOARD_PASSWORD in .env}
      # Endpoint MQTT public trả cho thiết bị khi activate
      MQTT_PUBLIC_ENDPOINT: ${MQTT_PUBLIC_ENDPOINT:?Set MQTT_PUBLIC_ENDPOINT to the public broker host:port}
    # Lưu ý: EMQX phải được provision auth trước (provision_auth.py) để backend user tồn tại.
    ports:
      - "${MONITOR_HTTP_BIND:-127.0.0.1}:${MONITOR_HTTP_PORT:-8090}:8090"
    depends_on:
      device-monitor-provision:
        condition: service_completed_successfully
      emqx:
        condition: service_healthy
      xiaozhi-redis:
        condition: service_healthy
    mem_limit: ${MONITOR_MEMORY_LIMIT:-200m}
    cpus: ${MONITOR_CPU_LIMIT:-0.3}
    networks:
      backend:
        aliases:
          - device-monitor

  xiaozhi-edge-router:
    image: nginx:${EDGE_NGINX_TAG:-1.27-alpine}
    restart: always
    depends_on:
      xiaozhi-server:
        condition: service_healthy
      xiaozhi-web:
        condition: service_started
    environment:
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-100m}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-300s}
      FIRMWARE_TRANSPORT_POLICY: ${FIRMWARE_TRANSPORT_POLICY:-mqtt_only}
      VIRTUAL_HOST: ${PUBLIC_DOMAIN:-device.oriagent.com}
      LETSENCRYPT_HOST: ${PUBLIC_DOMAIN:-device.oriagent.com}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-gamo100@proton.me}
      VIRTUAL_PORT: 80
      HTTPS_METHOD: redirect
    expose:
      - "80"
    volumes:
      - ./nginx/edge-router.conf.template:/etc/nginx/templates/default.conf.template:ro
    command:
      - /bin/sh
      - -c
      - |
        envsubst '$$CLIENT_MAX_BODY_SIZE $$PROXY_READ_TIMEOUT $$FIRMWARE_TRANSPORT_POLICY' \
          < /etc/nginx/templates/default.conf.template \
          > /etc/nginx/conf.d/default.conf && \
        nginx -g 'daemon off;'
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz | grep -q ok && wget -q -O /dev/null http://127.0.0.1/xiaozhi/ota/" ]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: ${EDGE_MEMORY_LIMIT:-128m}
    cpus: ${EDGE_CPU_LIMIT:-0.2}
    networks:
      - backend
      - proxy

  nginx-proxy:
    profiles: [ "ssl" ]
    image: nginxproxy/nginx-proxy:${NGINX_PROXY_TAG:-1.7.0}
    restart: always
    labels:
      com.github.nginx-proxy.nginx: "true"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DEFAULT_HOST: ${PUBLIC_DOMAIN:-device.oriagent.com}
    volumes:
      - proxy-certs:/etc/nginx/certs:ro
      - proxy-vhost:/etc/nginx/vhost.d
      - proxy-html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    depends_on:
      - xiaozhi-edge-router
    networks:
      - proxy

  nginx-acme:
    profiles: [ "ssl" ]
    image: nginxproxy/acme-companion:${ACME_COMPANION_TAG:-2.6}
    restart: always
    environment:
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL:-gamo100@proton.me}
      NGINX_PROXY_CONTAINER: xiaozhi-prod-nginx-proxy-1
    volumes:
      - proxy-certs:/etc/nginx/certs
      - proxy-vhost:/etc/nginx/vhost.d
      - proxy-html:/usr/share/nginx/html
      - proxy-acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - nginx-proxy
    networks:
      - proxy

networks:
  backend:
    driver: bridge
  proxy:
    driver: bridge

volumes:
  redis-data:
  emqx-data:
  emqx-log:
  proxy-certs:
  proxy-vhost:
  proxy-html:
  proxy-acme:
